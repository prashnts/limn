; The plot web UI (plot/server.py) on the Pi: http://<pi>:4219
; sudo ln -sf /home/pi/limn/limn_web.conf /etc/supervisor/conf.d/limn_web.conf
; sudo supervisorctl reread && sudo supervisorctl update
; Its log is with Klipper's, so Fluidd lists it: printer_data/logs/limn_web.log
[program:limn_web]
command=/home/pi/limn/.venv/bin/python -m plot serve --host 0.0.0.0 --port 4219
directory=/home/pi/limn
user=pi
environment=HOME="/home/pi",PYTHONUNBUFFERED="1",LIMN_PLOT_DATA="/home/pi/limn/plot-data",LIMN_MOONRAKER="http://127.0.0.1:7125"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/pi/printer_data/logs/limn_web.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
