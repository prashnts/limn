<line class="axis" x1="40.0" y1="231.99999999999974" x2="760.0" y2="231.99999999999974"/><text class="s" x="12.0" y="235.99999999999974">z68</text>
<line class="axis" x1="40.0" y1="186.99999999999974" x2="760.0" y2="186.99999999999974"/><text class="s" x="12.0" y="190.99999999999974">z69</text>
