<text class="s" x="503.4999999999999" y="312.9999999999996">old end (dashed)</text>
<text class="t" x="53.49999999999987" y="321.9999999999998">rack (plot-linear-gear)</text>
<text class="g" x="49" y="190">unlock step 35° (works)</text><text class="s" x="49" y="204">meets the straight face</text>
<text class="g" x="426.9999999999998" y="282.2499999999999" >new lift ramp ≤ 22°</text>
<text class="g" x="585.8682460426836" y="178.99999999999974">lock plateau</text>
<line class="dim" x1="835" y1="200" x2="420" y2="200" marker-end="url(#ar)" stroke-dasharray="5 3"/>
<text class="a" x="725" y="188">a steep bump here</text><text class="a" x="725" y="222">pushes the heel → jams</text>
<line class="ok" x1="330.2500000000001" y1="308.4999999999999" x2="319.0000000000001" y2="254.49999999999974" marker-end="url(#ag)"/>
<text class="g" x="184.0000000000001" y="299.4999999999998">shallow ramp: touches only the tip → lifts</text>
<line class="ok" x1="287.5" y1="360.2499999999995" x2="467.5" y2="360.2499999999995" marker-end="url(#ag)"/>
<text class="s" x="287.5" y="374.2499999999995">nub over the rack while locking (+X)</text>
<text class="t" x="20" y="425">Rule: the cam must be shallower than the follower everywhere it could touch. The curved face is 39° at the tip and steeper above,</text>
<text class="t" x="20" y="444">so a ramp ≤ 22° (pressure angle ≤ ~25° with PETG friction) only ever meets the tip and lifts it (friction resists the lift: keep it shallow).</text>
<text class="t" x="20" y="463">A steeper face, or the rack's square end, meets the curved face higher up, near the lever pivot: the push goes into the pivot and jams.</text>
<text class="t" x="20" y="482">Shape: start the ramp in the valley (z 67.2, 0.4 under the tip at rest), blend its foot (R ≥ 1), rise only to the click + ~0.5 overtravel, then a flat plateau.</text>
<text class="t" x="20" y="501">Never drive past the plateau. Unlocking goes back down the same ramp, so the straight face never meets a step from the right.</text>
<text class="t" x="20" y="520">Place it: plateau centre = tip position at the lock end ± 0.8. Measure two things first: rack travel from the unlock stop to locked</text>
<text class="t" x="20" y="539">(≈ 7.5 mm if the key turns 90°: 16 T m0.6 pinion), and lever lift to the click (the unlock step lifts 2.1; the click is lower).</text>
<text class="t" x="20" y="558">Drawn: 22° from x 91.0 to 95.4 (+1.8), plateau to 96.6: the rack gets ~2.7 mm longer. Check clearance past the base end (x 95.4) at the unlock stop.</text>
<text class="t" x="20" y="577">Klipper: QUERY_ENDSTOPS after K_LOCK → triggered = reached the lock; open = stalled short (or overshot, if travel is wrong).</text>
</svg>