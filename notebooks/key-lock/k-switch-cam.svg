<line class="axis" x1="40.0" y1="96.99999999999974" x2="760.0" y2="96.99999999999974"/><text class="s" x="12.0" y="100.99999999999974">z71</text>
<rect class="sw" x="127.2999999999999" y="70.0" width="450" height="80.99999999999987"/>
<text class="t" x="454.0000000000001" y="123.99999999999949">switch</text>
