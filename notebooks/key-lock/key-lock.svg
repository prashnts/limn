<text class="a" x="200.0" y="300.6" text-anchor="middle">cord pulls key ←</text>
<text class="s" x="20.0" y="462.0" text-anchor="start">Why: the floor was flat and the key rigid, so the clamp = how far the 3 M3 balls stick out (dowel 0.08 into the floor).</text>
<text class="s" x="20.0" y="479.0" text-anchor="start">With 4 pins the dowel must hold their push AND climb the sharp slot edge under load: ~2-3 N at the rack, K stalls.</text>
<text class="s" x="20.0" y="496.0" text-anchor="start">Now: at rest the cord holds the pinion on the cover, so the dowel sits ~0.5 into the seated floor.</text>
<text class="s" x="20.0" y="513.0" text-anchor="start">Locking, the lead-in lifts it; the key moves 0.5 toward the tool and the cord, not plastic, sets the clamp.</text>
<text class="s" x="20.0" y="530.0" text-anchor="start">Pinion face trimmed 0.5, else it lands on the base after 0.42 and the lock is rigid again.</text>
<text class="t" x="630.0" y="52.0" text-anchor="start">B  Floor under one dowel end, unrolled (r ≈ 5)</text>
<line class="axis" x1="640.0" y1="150.0" x2="1030.0" y2="150.0"/>
<rect fill="#fff" stroke="#bbb" stroke-dasharray="3 2" x="640.0" y="105.0" width="81.2" height="142.5"/>
<text class="s" x="680.6" y="261.5" text-anchor="middle">slot</text>
