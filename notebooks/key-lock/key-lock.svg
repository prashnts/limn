<text class="a" x="839.2" y="460.0" text-anchor="start">pockets r 3.6-5.2, 0.7 deep</text>
<text class="a" x="839.2" y="476.0" text-anchor="start">3 cord pieces ~3 mm (cs 1.5)</text>
<text class="s" x="839.2" y="492.0" text-anchor="start">force ∝ total length: add/remove</text>
<text class="s" x="839.2" y="508.0" text-anchor="start">pieces to tune (~4-5 N target)</text>
<text class="s" x="839.2" y="530.0" text-anchor="start">dashed: root Ø8.1; dotted: base bore Ø7</text>
<text class="s" x="839.2" y="546.0" text-anchor="start">teeth 6 → 5.5 wide vs rack 5.6: fine</text>
<text class="t" x="20.0" y="580.0" text-anchor="start">Numbers (estimates):</text>
<text class="s" x="20.0" y="598.0" text-anchor="start">• clamp target ≈ 1.3 × total pin push (measure: press a tool on over a kitchen scale)</text>
<text class="s" x="20.0" y="616.0" text-anchor="start">• full O-ring ≈ 0.5-0.9 N/mm of cord at 20-25 % → a full ring (~27 mm) 15-25 N: too stiff, use pieces</text>
<text class="s" x="20.0" y="634.0" text-anchor="start">• pocket depth = cs·(1 − 0.25) − 0.42 → 0.7 for cs 1.5 (no squeeze at rest, ~25 % locked)</text>
<text class="s" x="20.0" y="652.0" text-anchor="start">• rack force at 3.75 N clamp, greased (μ 0.15): ~1.2 N on the lead-in, ~0.5 N on the flat; dry ~1.75 N</text>
<text class="s" x="20.0" y="670.0" text-anchor="start">• K motor push unknown: stall the rack end on the scale</text>
<text class="s" x="20.0" y="688.0" text-anchor="start">• balls only seat now: all 3 at equal protrusion (3.65 as modelled), caliper depth rod</text>
<text class="s" x="20.0" y="706.0" text-anchor="start">• check after: X ladder (~/claude-cell/xladder.py) shows a clean step at the lock</text>
</svg>