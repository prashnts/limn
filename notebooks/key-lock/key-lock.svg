<text class="a" x="802.5" y="206.2" text-anchor="start">lead-in: 0.8 deep → 0 over ~40°</text>
<text class="a" x="932.5" y="181.2" text-anchor="middle">detent 0.15 @ 90° (locked)</text>
<text class="s" x="727.2" y="236.2" text-anchor="start">chamfer</text>
<text class="s" x="1030.0" y="86.0" text-anchor="end">dowel Ø2 (not to scale)</text>
<text class="s" x="630.0" y="299.5" text-anchor="start">grey dashed = now (flat, sharp edge).</text>
<text class="s" x="630.0" y="313.5" text-anchor="start">Leading edge only; the same on the opposite side.</text>
<text class="s" x="630.0" y="327.5" text-anchor="start">The detent holds the lock with the motor off: lost steps stop mattering.</text>
<text class="t" x="630.0" y="372.0" text-anchor="start">C  Pinion front face (tool side), after the 0.5 trim</text>
