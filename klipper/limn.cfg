  _BUZZ_711

[gcode_macro LIMN_SENSOR_CALIBRATE]
gcode:
  LRT_CALIBRATE

[gcode_macro LIMN_TOOL_CALIBRATE]
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set existing_tool = svv.currently_docked_tool|default(0)|int %}
  {% set dock_tool = params.T|default(0)|int %}

  {% if existing_tool == 0 and dock_tool <= 40%}
    M118 Not holding a tool and none specified.
  {% else %}
    {% if dock_tool > 40 %}
      DOCK T={dock_tool}
    {% else %}
      G28
    {% endif %}

    LRT_PROBE_TOOL
  {% endif %}

