[gcode_macro _DOCK_HOME]
description: "Home to Tools"
gcode:
  G1 X{dock_x}
  G1 Z{dock_z}
  G1 Y{dock_x}
variable_dock_z: 7.9
variable_dock_x: 114
variable_dock_y: 13

variable_tool_41_x: 125
variable_tool_41_y: 16
variable_tool_41_z: 8
variable_tool_41_dx: 51
variable_tool_41_dy: 0
variable_tool_41_dz: 0

variable_tool_42_x: 125
variable_tool_42_y: 56
variable_tool_42_z: 8
variable_tool_42_dx: 51
variable_tool_42_dy: 0
variable_tool_42_dz: 0

variable_tool_43_x: 125
variable_tool_43_y: 96
variable_tool_43_z: 8
variable_tool_43_dx: 51
variable_tool_43_dy: 0
variable_tool_43_dz: 0

variable_tool_44_x: 125
variable_tool_44_y: 136
variable_tool_44_z: 8
variable_tool_44_dx: 51
variable_tool_44_dy: 0
variable_tool_44_dz: 0

variable_tool_45_x: 125
variable_tool_45_y: 176
variable_tool_45_z: 8
variable_tool_45_dx: 51
variable_tool_45_dy: 0
variable_tool_45_dz: 0


[gcode_macro _DOCK_TOOL]
description: Dock/undock given tool. eg. _DOCK_TOOL T=42 ACT=dock|undock|calibrate
gcode:
  {% set tool_id = params['T']|default(42)|int %}
  {% set prefix = "tool_" ~ tool_id ~ "_" %}
  {% set docking = params['ACT'] == 'dock' %}
  {% set calibrate = 15 if params['ACT'] == 'calibrate' else 0 %}
  {% set dh = printer["gcode_macro _DOCK_HOME"] %}
  {% set mesh_profile = printer.bed_mesh.profile_name %}

  # The holder must have the tool to pick up, and be free to return one.
  # The checks and TOOL_CHANGE_PHASE also drive the LEDs, see ext/limn/leds.py.
  {% if docking %}
    TOOL_HOLDER_CHECK T={tool_id} EXPECT=occupied ARM=1
  {% elif params['ACT'] == 'undock' %}
    TOOL_HOLDER_CHECK T={tool_id} EXPECT=empty ARM=1
  {% endif %}

  # SAVE_GCODE_STATE NAME=DOCK_TOOL_state

  G90
  G1 F6000
  M118 {params['ACT']}ing {tool_id}

  _CLEAR_OFFSETS

  # Home to tool
  # {% if docking %}
  #   G28
  # {% else %}
  #   G28 Z
  #   LAZY_HOME
  # {% endif %}
  G1 Z9.2
  G1 F5500
  
  G1 X{dh[prefix + "x"]} Y{dh[prefix + "y"]}
  G1 Z{dh[prefix + "z"]}

  QUERY_ENDSTOPS
  M400
  TOOL_CHANGE_PHASE PHASE=engage
  K_UNLOCK

  # Switch to relative coords
  G91
  
  # Move towards threshold
  G1 Z{dh[prefix + "dz"]}
  G1 Y{dh[prefix + "dy"]}
  G1 X{dh[prefix + "dx"] / 2}
  _BUZZ_ACT

  # Slow down
  G1 F2500
  G1 X{dh[prefix + "dx"] / 2}

  # Dock/undock the tool
  {% if docking %}
    _BUZZ_ACT
    G1 F1500
    # Nudge
    G1 Z0.5 Y-0.5 X-0.5
    G1 X0.5 Y0.5
    G1 Z-0.5
    K_LOCK_UNLOCK_LOCK
  {% elif params['ACT'] == 'undock' %}
    _BUZZ_ACT
  {% endif %}

  # Move away from threshold
  TOOL_CHANGE_PHASE PHASE=leave
  G1 F2000

  G1 X-{dh[prefix + "dx"]}
  G1 Y-{dh[prefix + "dy"]}

  # Speed up
  G1 F4500
  # G1 F2500
  # End relative motion
  G90

  # Save the carried tool only once the holder confirms the move
  {% if docking %}
    TOOL_HOLDER_CHECK T={tool_id} EXPECT=empty
    SAVE_VARIABLE VARIABLE=currently_docked_tool VALUE={tool_id}
  {% elif params['ACT'] == 'undock' %}
    TOOL_HOLDER_CHECK T={tool_id} EXPECT=occupied
    SAVE_VARIABLE VARIABLE=currently_docked_tool VALUE=0
    SAVE_VARIABLE VARIABLE=tool_offset_x VALUE=0
    SAVE_VARIABLE VARIABLE=tool_offset_y VALUE=0
    SAVE_VARIABLE VARIABLE=tool_offset_z VALUE=0
    SAVE_VARIABLE VARIABLE=tool_name VALUE='""'
  {% endif %}

  {% if docking %}
    # After picking up the tool
    K_LOCK_UNLOCK_LOCK
    RFID_READ
    G28
  {% endif %}

  M118 {params['ACT']}ed {tool_id}.
  _BUZZ_ACT

  # RESTORE_GCODE_STATE NAME=DOCK_TOOL_state

[gcode_macro DOCK]
description: Dock given tool. eg. DOCK T=42 [K=70..74]
gcode:
  {% set tool_id = (params.K|int + 1 - 30) if 'T' not in params else params.T|int %}
  {% set svv = printer.save_variables.variables %}
  {% set existing_tool = svv.currently_docked_tool|default(0)|int %}

  {% if existing_tool == tool_id %}
    _BUZZ_DOOP
    M118 Currently Docked: {tool_id}, reading tag...
    LAZY_HOME
    RFID_READ
    # _APPLY_OFFSETS
  {% else %}
    {% if existing_tool > 0 %}
      # Undock if holding a tool
      M118 Undocking EXT:{existing_tool} before docking NEW:{tool_id}.
      _DOCK_TOOL T={existing_tool} ACT=undock
    {% endif %}

    _DOCK_TOOL T={tool_id} ACT=dock
    _BUZZ_DOOP
  {% endif %}

[gcode_macro DOCK_RESET]
description: Reset Docking
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set existing_tool = svv.currently_docked_tool|default(0)|int %}
  M118 [Dock][reset] Existing Tool:{existing_tool} cleared.
  SAVE_VARIABLE VARIABLE=currently_docked_tool VALUE=0
  SAVE_VARIABLE VARIABLE=tool_offset_x VALUE=0
  SAVE_VARIABLE VARIABLE=tool_offset_y VALUE=0
  SAVE_VARIABLE VARIABLE=tool_offset_z VALUE=0
  SAVE_VARIABLE VARIABLE=tool_name VALUE='""'
  TOOL_CHANGE_PHASE PHASE=idle
  _BUZZ_DOOP

[gcode_macro DOCK_RECALL]
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set existing_tool = svv.currently_docked_tool|default(0)|int %}
  M118 [Dock][recall] Existing Tool:{existing_tool}.
  _BUZZ_DOOP

[gcode_macro UNDOCK]
description: Dock current tool back to its original position. eg. UNDOCK
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set existing_tool = svv.currently_docked_tool|default(0)|int %}

  LAZY_HOME

  {% if existing_tool == 0 %}
    # Undock if holding a tool
    M118 Nothing to undock.
  {% else %}
    _DOCK_TOOL T={existing_tool} ACT=undock
  {% endif %}

[shell_output sh_output_buffer]

[limn]
serial: /dev/serial/by-id/usb-MicroPython_Board_in_FS_mode_e6625887d3390f34-if00
baud: 115200
tool_holder_i2c_bus: 1
tool_holder_address: 0x20
tool_holder_pins: 15:41, 14:42, 13:45, 12:43, 11:44
tool_holder_tag_address: 0x24


# TOOL_TAG_READ/WRITE saved the tag's offsets and set the LEDs already; this is the buzz.
# A macro of its own: printer.limn.tag is read when the macro starts.
[gcode_macro _RFID_FEEDBACK]
gcode:
  {% set tag = printer.limn.tag %}
  {% if not tag.ok %}
    _BUZZ_RFID_ERR
    M118 Tag: {tag.error}
  {% else %}
    _BUZZ_711
  {% endif %}


[gcode_macro WRITE_TOOL_TAG]
gcode:
    {% set dx = ' DX=' ~ params.DX if 'DX' in params else '' %}
    {% set dy = ' DY=' ~ params.DY if 'DY' in params else '' %}
    {% set dz = ' DZ=' ~ params.DZ if 'DZ' in params else '' %}
    {% set name = (" NAME='" ~ params.NAME ~ "'") if 'NAME' in params else '' %}
    TOOL_TAG_WRITE{dx}{dy}{dz}{name}
    _BUZZ_RFID_OK
    G1 Z7
    _RFID_FEEDBACK

[gcode_macro _RFID_HOME]
description: Move to the tag reader
gcode:
  _CLEAR_OFFSETS
  LAZY_HOME
  G1 F6500
  G1 X100
  G1 Y3
  G1 X135
  G1 Z7
  M400

# The reader doesn't always extend all the way: going into the carried tool's
# holder pushes it out. TOOL_TAG_READ/WRITE run this between tries
# (tool_holder_tag_retries in [limn]), with T= the carried tool when its holder
# reads empty, else T=0: then it only comes at the reader again (_RFID_HOME, the
# way a read after a write used to go). Never past X135 at the reader: holding
# a tool, there is only 1-2 cm along X before it hits the dock.
[gcode_macro _RFID_NUDGE]
description: Get the tag reader to extend fully, then back to it
gcode:
  {% set tool = params.T|default(0)|int %}
  {% if tool %}
    _HOLDER_REENTER T={tool}
  {% endif %}
  _RFID_HOME

# Into the tool's (empty) holder and out, holding the tool locked: _DOCK_TOOL's
# moves without the unlock. All the way in, onto the holder's switch, for a
# reliable push on the reader; the extension takes that switch as its own move.
# `gap` stops that many mm short instead.
[gcode_macro _HOLDER_REENTER]
description: Go into a tool's holder and out again, keeping the tool
variable_gap: 0
gcode:
  {% set tool_id = params.T|int %}
  {% set prefix = "tool_" ~ tool_id ~ "_" %}
  {% set dh = printer["gcode_macro _DOCK_HOME"] %}
  {% set dx = dh[prefix + "dx"] %}
  G90
  G1 Z9.2
  G1 F5500
  G1 X{dh[prefix + "x"]} Y{dh[prefix + "y"]}
  G1 Z{dh[prefix + "z"]}
  G91
  G1 Z{dh[prefix + "dz"]}
  G1 Y{dh[prefix + "dy"]}
  G1 X{dx / 2}
  G1 F2500
  G1 X{dx / 2 - gap}
  G1 F2000
  G1 X-{dx - gap}
  G1 Y-{dh[prefix + "dy"]}
  G1 Z-{dh[prefix + "dz"]}
  G1 F4500
  G90
  M400

[gcode_macro RFID_READ]
gcode:
  # Moves to the reader, reads, saves the offsets
  TOOL_TAG_READ
  _BUZZ_ACT
  G1 Z7
  _RFID_FEEDBACK
  # _APPLY_OFFSETS

[gcode_macro DOCK_SCAN]
gcode:
  G28
  T0
  T1
  T2
  T3
  T4
  UNDOCK

[gcode_macro PLOT_START]
gcode:
  _BUZZ_711
  {% set tool = params.EXT|default(0)|int %}

[gcode_macro PLOT_END]
gcode:
