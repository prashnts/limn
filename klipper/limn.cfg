
[gcode_macro K_LOCK]
gcode:
  MANUAL_STEPPER STEPPER=axis_k ENABLE=1 SET_POSITION=0 MOVE=16
  _BUZZ_ACT
  MANUAL_STEPPER STEPPER=axis_k ENABLE=0
  _BUZZ_K_LOCK
  SET_LED_EFFECT EFFECT=ui_key_locked REPLACE=1

[gcode_macro K_LOCK_UNLOCK_LOCK]
gcode:
  MANUAL_STEPPER STEPPER=axis_k ENABLE=1 SET_POSITION=0 MOVE=10
  _BUZZ_ACT
  MANUAL_STEPPER STEPPER=axis_k ENABLE=1 SET_POSITION=16 MOVE=8
  _BUZZ_ACT
  MANUAL_STEPPER STEPPER=axis_k ENABLE=1 SET_POSITION=0 MOVE=16
  _BUZZ_ACT
  MANUAL_STEPPER STEPPER=axis_k ENABLE=0
  _BUZZ_K_LOCK
  SET_LED_EFFECT EFFECT=ui_key_locked REPLACE=1

[gcode_macro K_UNLOCK]
gcode:
  {% set lock_status = printer.query_endstops.last_query['manual_stepper axis_k'] %}
  # {% if not lock_status %}
  {% if True %}
    MANUAL_STEPPER STEPPER=axis_k ENABLE=1 SET_POSITION=16 MOVE=0
    _BUZZ_ACT
    MANUAL_STEPPER STEPPER=axis_k ENABLE=0
    _BUZZ_K_UNLOCK
  {% else %}
    _BUZZ_K_SKIPUNLOCK
  {% endif %}
  SET_LED_EFFECT EFFECT=ui_key_unlocked REPLACE=1


[gcode_macro LAZY_HOME]
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_0
gcode:
  G28 Z
  UNDOCK
  G1 X65 Y45
  BED_MESH_CALIBRATE_0 {rawparams}
  _BUZZ_ACT

[gcode_macro PROBE_ACCURACY]
rename_existing: PROBE_ACCURACY_0
gcode:
  LAZY_HOME
  PROBE_ACCURACY_0 {raw_params}

[gcode_macro _SAFE_OFFSET_HOME]
gcode:
  {% set gcode_x = printer.gcode_move.gcode_position.x|float %}
  {% set gcode_y = printer.gcode_move.gcode_position.y|float %}
  {% set recenter = params.HOME|default(0)|int %}
  {% if recenter %}
    G1 Z8
    G1 X42 Y123
  {% else %}
    G1 Z7
    {% if gcode_y < 5 %}
      G1 Y5
    {% endif %}
    {% if gcode_x < 5 %}
      G1 X5
    {% endif %}
  {% endif %}

[gcode_macro _APPLY_OFFSETS]
gcode:
  {% set mesh_profile = printer.bed_mesh.profile_name %}
  {% set svv = printer.save_variables.variables %}
  {% set offset_x = svv.tool_offset_x|default(0)|float %}
  {% set offset_y = svv.tool_offset_y|default(0)|float %}
  {% set offset_z = svv.tool_offset_z|default(0)|float %}
  {% set last_mesh_profile = svv.last_mesh_profile %}
  {% set recenter = params.HOME|default(0)|int %}
  {% set mesh_name_override = params.MESH if 'MESH' in params else last_mesh_profile %}

  _SAFE_OFFSET_HOME HOME={recenter}

  SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=1
  BED_MESH_OFFSET X=0 Y=0
  SET_GCODE_OFFSET X={offset_x} Y={offset_y} Z={offset_z} MOVE=1

  G1 Z7

  M118 Would load mesh: {mesh_name_override}
  {% if mesh_name_override %}
    BED_MESH_PROFILE LOAD={mesh_name_override}
    BED_MESH_OFFSET X={offset_x} Y={offset_y}
    SAVE_VARIABLE VARIABLE=last_mesh_profile VALUE='"{mesh_name_override}"'
  {% endif %}
  _BUZZ_ACT

[gcode_macro _CLEAR_OFFSETS]
gcode:
  {% set recenter = params.HOME|default(0)|int %}
  {% set mesh_profile = printer.bed_mesh.profile_name %}
  _SAFE_OFFSET_HOME HOME={recenter}

  {% if mesh_profile %}
    SAVE_VARIABLE VARIABLE=last_mesh_profile VALUE='"{mesh_profile}"'
    BED_MESH_CLEAR
    M118 Cleared mesh
  {% endif %}
  BED_MESH_OFFSET X=0 Y=0
  SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=1
  M118 Offset Cleared
  _BUZZ_WARN


[gcode_macro G1]
rename_existing: G1.1 # Rename the existing G1 command to G1.1
gcode:
  {% set p_x = ' X' ~ params.X if 'X' in params else '' %}
  {% set p_y = ' Y' ~ params.Y if 'Y' in params else '' %}
  {% set p_z = ' Z' ~ params.Z if 'Z' in params else '' %}
  {% set p_f = ' F' ~ params.F if 'F' in params else '' %}
  {% set act = params.ACT|int if 'ACT' in params else 0 %}
  {% if act == 1 %}
    # PEN DOWN
    {% set p_z = " Z1" %}
  {% elif act == 2 %}
    # PEN UP
    {% set p_z = " Z3" %}
  {% elif act == 3 %}
    # TRAVEL
    {% set p_z = " Z5" %}
  {% endif %}
  {% set ps = p_x + p_y + p_z + p_f %}
  G1.1 {ps}
variable_last_dir: 1

