### DOCK

[led_effect ui_docked_tool_0]
autostart:              false
recalculate: true
leds:
    neopixel:picam (5,12,13,21,28,29,30)
layers:
    {% set tl = printer["gcode_macro _limn_leds"] %}
    {% set color = tl["traffic_light_" ~ params.COL|default('white')]%}
    static  1 1 top {color}


