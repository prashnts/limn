
[neopixel indockator]
pin: rpi:gpio17
chain_count: 30
color_order: GRB

[neopixel lamp]
pin: rpi:gpio16
chain_count: 30
color_order: GRBW

[neopixel picam]
pin: rpi:gpio15
chain_count: 32
color_order: GRB

[led_effect lamp_idle]
autostart:              true
frame_rate: 8
leds:
    neopixel:lamp
layers:
    static     1 0 lighten (0,0,0,.2)



[led_effect ui_xstepper_trigger]
leds:
    neopixel:picam (3)
autostart: true
endstops: stepper_x
layers:
    homing     15 0 add (0.7,0,0)

[led_effect ui_ystepper_trigger]
leds:
    neopixel:picam (11)
autostart: true
endstops: stepper_y
layers:
    homing     15 0 add (0,0.7,0)

[led_effect ui_zstepper_trigger]
leds:
    neopixel:picam (19)
autostart: true
endstops: stepper_z
layers:
    homing     15 0 add (0,0.2,0.9)

[led_effect ui_xyzstepper_trigger]
leds:
    neopixel:picam (3,11,19)
autostart: false
endstops: stepper_x,stepper_y,stepper_z
layers:
    homing     15 0 add (0.22,0.53,0)


[led_effect cam_idle]
autostart:              false
frame_rate: 8
leds:
    neopixel:picam
layers:
    static 1 0 top (0.5,0.5,0.1)

# The calibration's "touch the panel now" prompt (ext/limn/rtp.py)
[led_effect ui_alert_blink]
autostart:              false
frame_rate: 8
leds:
    neopixel:picam (1,2,9,10)
layers:
    blink 2 0.5 top (0.55,0.37,0)

