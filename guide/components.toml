# Limn's bought parts, from the Hackaday project's component list
# (https://hackaday.io/project/205431/components, copied 2026-10-02).
# `step`: the matching design(s) in the STEP export (guide/step.py tree), when
# the CAD has it. `note`: where the list and the CAD (v88) disagree.

[[part]]
qty = 2
name = "NEMA 17 Stepper Motor"
use = "CoreXY A and B axes"
step = ["4798N11_Light Duty Stepper Motor"]

[[part]]
qty = 1
name = "10mm Linear Micro Stepper Motor"
use = "K axis: the toolchanger key"
step = ["5mm stepper slider"]

[[part]]
qty = 1
name = "NEMA 8 Stepper Motor"
use = "Z axis"
step = ["NEMA 8 - Ali"]

[[part]]
qty = 6
name = "M2x6 SHSS Machine Screw"
use = "Form the toolchanger docking surface"
step = ["M2x2.5x6 SHSS Machine Screw - AA114"]

[[part]]
qty = 3
name = "M2.5x5 Button Head Screw"
use = "The kinematic coupling triple"
note = "Not in the v88 CAD (its tool keys use M3x5 BHCS - AA171, 2 per key)."

[[part]]
qty = 6
name = "4x2 mm round magnet"
use = "On the SHSS screws, to pull the coupling triple in"
note = "Not in the v88 CAD."

[[part]]
qty = 12
name = "10x5x1 mm rectangular magnet"
use = "2 per tool, 2 per tool holder, several for the bed"
note = "Not in the v88 CAD."

[[part]]
qty = 1
name = "KFC-W-13W Micro Switch"
use = "Z axis endstop (up)"
step = ["micro-limit-switch"]

[[part]]
qty = 6
name = "Reset detection micro switch"
use = "AliExpress find: small switches with screw holes. Tool presence in the holders, and the key."
step = ["micro-limit-sw-inline"]

[[part]]
qty = 1
name = "Klipper MCU"
use = "A Melzi board for now, with 4 stepper drivers, from the same old printer as the frame"
reclaimed = true
step = ["melzi-base"]

[[part]]
qty = 1
name = "BLTouch Z probe"
step = ["BLTouch"]

[[part]]
qty = 1
name = "MCP23017 I2C breakout"
use = "Reads the tool holders' switches"
step = ["MCP23017 Adafruit"]

[[part]]
qty = 1
name = "PN532 RFID breakout"
use = "Reads the tools' tags"
step = ["PN532_NFC_Assembly"]

[[part]]
qty = 1
name = "Transistor OR gate"
use = "DIY: merges two BLTouch-like probe signals"
note = "Not in the CAD."

[[part]]
qty = 1
name = "Resistive touch screen panel"
use = "Automatic offset calibration (soon optional)"
step = ["Resistive Touch Panel"]

[[part]]
qty = 1
name = "FS-ARR-4X8-ROT"
use = "4x8 force sensitive resistor, for precise automatic offset calibration"
step = ["FSR 32 Zones"]

[[part]]
qty = 1
name = "CoreXY frame"
use = "Built from an old 3D printer + a 3D printed framework"
reclaimed = true
step = ["SteelRod-8x285", "SteelRod-8x235", "SteelRod-6x270", "6485K23_Linear and Rotary Ball Bearing", "Idler-pulley-12mm"]

[[part]]
qty = 3
name = "Waveshare RP2040"
use = "Thin enough to sit in the tool calibration bed"
step = ["RP2040-Tiny V1.1"]
note = "The v88 CAD has 2 RP2040-Tiny in the bed."

[[part]]
qty = 1
name = "RP2040 MCU"
use = "Extra GPIO for the LEDs and the buzzer"
step = ["Raspberry_Pi_Pico_WH"]

[[part]]
qty = 1
name = "Limn Z axis"
use = "Several designs printed, still evolving"

[[part]]
qty = 1
name = "Pogo pins, 5 mm"
use = "Data between the tool and the plotter"
step = ["Pogo Pin 5mm"]
note = "The v88 CAD has 4."

[[part]]
qty = 1
name = "Raspberry Pi 4"
use = "Runs Klipper"
note = "The CAD has a CM4 case (Waveshare CM4-NANO-B in v11; the case is empty in v88)."

[[part]]
qty = 1
name = "USB UVC cameras"
use = "Debugging and monitoring"
step = ["ArduCam UB0240 webcam"]
note = "The ArduCam was in v46, not in v88."

[[part]]
qty = 1
name = "USB-C 65 W power supply"
use = "Powers the Pi, and the plotter through a 12 V trigger cable"

[[part]]
qty = 1
name = "Power switch"
use = "For emergencies"
step = ["Power Switch Board with 2Pin XH2.54 Connector-XA007"]
