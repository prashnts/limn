# The tools in the holders, by the macro that picks them up (T0 -> DOCK T=41).
# Seeded from the extruders in slicer/config.ini: edit to what is in the holders.
#
# kind: pen, pencil, brush, laser (plot/tools.py), or "package.module:Class",
# or a kind from a file in `plugins` (paths relative to this file).
# width: the line the tool leaves, mm. Fills are spaced width * (1 - overlap).
# Heights are over the surface (the paper: 0), tag offsets applied; z_min and
# z_max narrow the machine's limits for this tool.

plugins = []

[T0]
kind = "pen"
name = "Stabilo Test Blue"  # its tag; the sacrificial one, for tests
color = "#3a4fb8"
width = 0.4

[T1]
kind = "pen"
name = "Green 0.5"
color = "#21ff06"
width = 0.5

[T2]
kind = "pen"
name = "Green 0.5"
color = "#21ff06"
width = 0.5

[T3]
kind = "pen"
name = "Red 0.5"
color = "#fb0207"
width = 0.5

[T4]
kind = "pen"
name = "Fineliner 0.5"
color = "#8000ff"
width = 0.5

