<text x="60" y="741.6850393700788" font-size="10.5" text-anchor="start" fill="#8a8a8e" font-weight="normal">Not on the headers: Qwiic = I2C0 on GP16/17 (the holders' MCP23017 + PN532, later?), WS2812 on GP25, BOOT + RESET (hold BOOT, tap RESET: the RPI-RP2 drive).</text>
<text x="60" y="757.6850393700788" font-size="10.5" text-anchor="start" fill="#8a8a8e" font-weight="normal">GP10-15 and GP18/19/24 aren't brought out. Klipper fallback: spi_bus spi0_gpio20_gpio23_gpio22, cs gpio8, data_ready gpio7 (ADS #2).</text>
