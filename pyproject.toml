[project]
name = "limn-v1"
version = "0.1.0"
description = "Extras for Limn Pen Plotter."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipython>=9.12.0",
    "requests>=2.32.5",
    "typer>=0.21.1",
    "adafruit-blinka>=9.0.4",
    "adafruit-circuitpython-pn532>=2.4.8",
    "pyserial>=3.5",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "mpremote>=1.28.0",
    "sparkfun-qwiic-button>=2.0.3",
    "adafruit-circuitpython-mcp230xx>=2.6.2",
    "pydantic>=2.13.4",
    "redis[hiredis]>=8.1.0",
    "fastapi[standard]>=0.141.1",
    "spectra>=0.1.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "anywidget>=0.11.0",
    "jupyterlab>=4.5.7",
    "plotly>=6.7.0",
]
